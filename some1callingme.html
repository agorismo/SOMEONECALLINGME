<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SOME1CALLINGME: Vídeo e Compartilhamento de tela</title>
    <meta name="description"
        content="Faça chamadas de vídeo com amigos direto no navegador, no PC ou no celular. Crie uma sala, envie o código e compartilhe sua tela.">
    <meta name="theme-color" content="#111111">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SOME1CALLING">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="SOME1CALLINGME: Vídeo e Compartilhamento de Tela">
    <meta property="og:description"
        content="Chamadas de vídeo com amigos no navegador, sem instalar nada. Crie uma sala, envie o código e pronto.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SOME1CALLINGME: Vídeo e Compartilhamento de Tela">
    <meta name="twitter:description"
        content="Chamadas de vídeo com amigos no navegador, sem instalar nada. Crie uma sala, envie o código e pronto.">


    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            color-scheme: dark;
        }

        .screen {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* Tela inicial */
        #lobby {
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            overflow-y: auto;
        }

        .card {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 4px;
        }

        .hint {
            font-size: 13px;
            opacity: .6;
            text-align: center;
        }

        .divider {
            text-align: center;
            font-size: 13px;
            opacity: .5;
        }

        .err {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            min-height: 16px;
        }

        .avatar-pick {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        #avatar-btn {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            border: 2px dashed #444;
            background: #1c1c1c;
            overflow: hidden;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #aaa;
        }

        #avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .small-link {
            background: none;
            color: #2b6cff;
            font-size: 13px;
            padding: 4px;
            font-weight: 500;
        }

        input,
        button {
            font-family: inherit;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1c1c1c;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2b6cff;
        }

        .counter {
            font-size: 12px;
            opacity: .5;
            text-align: right;
            margin-top: -6px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            border: 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #2b6cff;
            color: #fff;
        }

        button:active {
            opacity: .8;
        }

        .secondary {
            background: #2a2a2a;
        }

        /* Tela de chamada */
        #call {
            position: relative;
            overflow: hidden;
        }

        #remote {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #local {
            position: absolute;
            right: 12px;
            top: calc(60px + env(safe-area-inset-top));
            width: 30vw;
            max-width: 180px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #333;
            background: #222;
            transform: scaleX(-1);
            z-index: 2;
        }

        #local.no-mirror {
            transform: none;
        }

        .topbar {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            z-index: 3;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, .6), transparent);
            font-size: 14px;
        }

        .peer-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .peer-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
            border: 1px solid #555;
        }

        .peer-info .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #clock {
            opacity: .8;
            flex-shrink: 0;
            margin-left: 10px;
        }

        #status {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            text-align: center;
            font-size: 16px;
            padding: 0 20px;
            white-space: pre-line;
        }

        #status .big-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 14px;
            background: #333;
        }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 18px 16px;
            padding-bottom: calc(18px + env(safe-area-inset-bottom));
            background: linear-gradient(transparent, rgba(0, 0, 0, .7));
            flex-wrap: wrap;
        }

        .ctrl {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 0;
            font-size: 22px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl.off {
            background: #e5484d;
        }

        .ctrl.active {
            background: #2b6cff;
        }

        .hang {
            background: #e5484d;
            border-radius: 28px;
            height: 56px;
            padding: 0 24px;
            font-size: 16px;
        }

        @media (min-width: 700px) {
            #local {
                width: 240px;
            }

            #status .big-avatar {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <!-- TELA INICIAL -->
    <section id="lobby" class="screen active">
        <div class="card">
            <h1>SOME1CALLINGME</h1>

            <div class="avatar-pick">
                <button id="avatar-btn" type="button">Foto</button>
                <button id="avatar-clear" class="small-link" type="button" style="display:none">Remover foto</button>
                <input id="avatar-file" type="file" accept="image/*" hidden>
            </div>

            <input id="name" placeholder="Seu usuário (1 a 10 caracteres)" maxlength="10" autocomplete="off">
            <div id="name-counter" class="counter">0/10</div>

            <button id="btn-create">Criar sala</button>
            <div class="divider">ou</div>
            <input id="code" placeholder="Código da sala" maxlength="6" autocomplete="off">
            <button id="btn-join" class="secondary">Entrar na sala</button>

            <div id="lobby-err" class="err"></div>
            <p class="hint">Quem criou a sala envia o código para a outra pessoa.</p>
        </div>
    </section>

    <!-- TELA DE CHAMADA -->
    <section id="call" class="screen">
        <video id="remote" autoplay playsinline></video>
        <video id="local" autoplay playsinline muted></video>
        <div id="status">Iniciando...</div>

        <div class="topbar">
            <div class="peer-info">
                <img id="peer-avatar" alt="" style="display:none">
                <span id="peer-name" class="name"></span>
            </div>
            <span id="clock"></span>
        </div>

        <div class="controls">
            <button id="btn-mic" class="ctrl" title="Microfone">🎤</button>
            <button id="btn-cam" class="ctrl" title="Câmera">📷</button>
            <button id="btn-screen" class="ctrl" title="Compartilhar tela">🖥️</button>
            <button id="btn-hang" class="hang">Sair</button>
        </div>
    </section>

    <script>
        const $ = id => document.getElementById(id);

        const PREFIX = 'sala-';
        const MAX_NAME = 10;
        const MAX_AVATAR_BYTES = 800 * 1024; // limite para a foto trafegar entre os dois

        let peer = null;
        let call = null;
        let dataConn = null;
        let localStream = null;
        let screenTrack = null;
        let roomCode = '';
        let isHost = false;

        let myProfile = { name: '', avatar: '' };
        let peerProfile = { name: '', avatar: '' };

        /* ---------- Perfil ---------- */

        function updateNameCounter() {
            const len = $('name').value.trim().length;
            $('name-counter').textContent = len + '/' + MAX_NAME;
        }

        $('name').addEventListener('input', updateNameCounter);

        $('avatar-btn').onclick = () => $('avatar-file').click();

        $('avatar-clear').onclick = () => {
            myProfile.avatar = '';
            $('avatar-btn').innerHTML = 'Foto';
            $('avatar-clear').style.display = 'none';
            $('avatar-file').value = '';
        };

        // Lê a imagem. GIF é mantido como está (para continuar animado).
        // Outras imagens grandes são reduzidas para não ficarem pesadas.
        $('avatar-file').addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            setLobbyError('');

            if (!file.type.startsWith('image/')) {
                setLobbyError('Escolha uma imagem ou GIF.');
                return;
            }

            try {
                let dataUrl;
                if (file.type === 'image/gif' && file.size <= MAX_AVATAR_BYTES) {
                    dataUrl = await readAsDataURL(file);
                } else if (file.type === 'image/gif') {
                    setLobbyError('Esse GIF é muito pesado. Use um com até 800 KB.');
                    return;
                } else {
                    dataUrl = await shrinkImage(file, 256);
                }

                if (dataUrl.length > MAX_AVATAR_BYTES) {
                    setLobbyError('Essa imagem ainda ficou pesada. Escolha outra.');
                    return;
                }

                myProfile.avatar = dataUrl;
                $('avatar-btn').innerHTML = '';
                const img = document.createElement('img');
                img.src = dataUrl;
                $('avatar-btn').appendChild(img);
                $('avatar-clear').style.display = 'inline-block';
            } catch (err) {
                setLobbyError('Não consegui carregar a imagem.');
            }
        });

        function readAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        function shrinkImage(file, size) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const side = Math.min(img.width, img.height);
                    const sx = (img.width - side) / 2;
                    const sy = (img.height - side) / 2;
                    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function setLobbyError(msg) { $('lobby-err').textContent = msg; }

        function validateName() {
            const name = $('name').value.trim();
            if (name.length < 1 || name.length > MAX_NAME) {
                setLobbyError('Seu usuário precisa ter de 1 a 10 caracteres.');
                $('name').focus();
                return null;
            }
            return name;
        }

        /* ---------- Sala e conexão ---------- */

        function genCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let s = '';
            for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return s;
        }

        function setStatus(text) {
            const el = $('status');
            el.innerHTML = '';
            if (!text) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            if (peerProfile.avatar && !$('remote').srcObject) {
                const img = document.createElement('img');
                img.className = 'big-avatar';
                img.src = peerProfile.avatar;
                el.appendChild(img);
            }
            el.appendChild(document.createTextNode(text));
        }

        function updatePeerBar() {
            const nameEl = $('peer-name');
            const avatarEl = $('peer-avatar');
            nameEl.textContent = peerProfile.name || '';
            if (peerProfile.avatar) {
                avatarEl.src = peerProfile.avatar;
                avatarEl.style.display = 'block';
            } else {
                avatarEl.style.display = 'none';
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
        }

        setInterval(() => {
            $('clock').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        async function startMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: { echoCancellation: true, noiseSuppression: true }
            });
            $('local').srcObject = localStream;
        }

        // Troca de perfil pelo canal de dados
        function setupDataConn(conn) {
            dataConn = conn;
            conn.on('open', () => {
                conn.send({ type: 'profile', name: myProfile.name, avatar: myProfile.avatar });
            });
            conn.on('data', msg => {
                if (msg && msg.type === 'profile') {
                    peerProfile = { name: msg.name || '', avatar: msg.avatar || '' };
                    updatePeerBar();
                    if (!$('remote').srcObject) setStatus('Aguardando vídeo...');
                }
            });
        }

        async function enter(host) {
            isHost = host;
            setLobbyError('');

            const name = validateName();
            if (!name) return;
            myProfile.name = name;

            if (host) {
                roomCode = genCode();
            } else {
                roomCode = $('code').value.trim().toUpperCase();
                if (roomCode.length < 4) {
                    setLobbyError('Digite o código da sala.');
                    $('code').focus();
                    return;
                }
            }

            try {
                await startMedia();
            } catch (e) {
                setLobbyError('Não consegui acessar câmera e microfone. Confira as permissões do navegador.');
                return;
            }

            $('call').dataset.room = roomCode;
            showScreen('call');
            setStatus('Iniciando...');

            if (host) {
                setStatus('Aguardando alguém entrar.\nCódigo: ' + roomCode);
                peer = new Peer(PREFIX + roomCode);

                peer.on('connection', conn => {
                    // Recebe o perfil de quem entrou (vem em conn.metadata)
                    peerProfile = {
                        name: (conn.metadata && conn.metadata.name) || '',
                        avatar: (conn.metadata && conn.metadata.avatar) || ''
                    };
                    updatePeerBar();
                    setupDataConn(conn);
                });

                peer.on('call', incoming => {
                    incoming.answer(localStream);
                    attach(incoming);
                });

                peer.on('error', err => {
                    if (err.type === 'unavailable-id') {
                        setStatus('Esse código já está em uso. Recarregue a página para criar outra sala.');
                    } else {
                        setStatus('Erro de conexão: ' + err.type);
                    }
                });
            } else {
                setStatus('Conectando...');
                peer = new Peer();

                peer.on('open', () => {
                    // Envia o próprio perfil junto com a conexão
                    const conn = peer.connect(PREFIX + roomCode, {
                        metadata: { name: myProfile.name, avatar: myProfile.avatar }
                    });
                    setupDataConn(conn);

                    const outgoing = peer.call(PREFIX + roomCode, localStream);
                    if (!outgoing) { setStatus('Não foi possível conectar.'); return; }
                    attach(outgoing);
                });

                peer.on('error', err => {
                    if (err.type === 'peer-unavailable') {
                        setStatus('Sala não encontrada. Confira o código.');
                    } else {
                        setStatus('Erro de conexão: ' + err.type);
                    }
                });
            }
        }

        function attach(c) {
            call = c;
            c.on('stream', remoteStream => {
                $('remote').srcObject = remoteStream;
                setStatus('');
            });
            c.on('close', () => setStatus('A chamada foi encerrada.'));
            c.on('error', () => setStatus('Problema na chamada.'));
        }

        /* ---------- Controles ---------- */

        $('btn-mic').onclick = () => {
            const track = localStream && localStream.getAudioTracks()[0];
            if (!track) return;
            track.enabled = !track.enabled;
            $('btn-mic').classList.toggle('off', !track.enabled);
            $('btn-mic').textContent = track.enabled ? '🎤' : '🔇';
        };

        $('btn-cam').onclick = () => {
            const track = localStream && localStream.getVideoTracks()[0];
            if (!track) return;
            track.enabled = !track.enabled;
            $('btn-cam').classList.toggle('off', !track.enabled);
            $('btn-cam').textContent = track.enabled ? '📷' : '🚫';
        };

        async function replaceSentVideo(track) {
            const pc = call && call.peerConnection;
            if (!pc) return;
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) await sender.replaceTrack(track);
        }

        $('btn-screen').onclick = async () => {
            if (screenTrack) { await stopScreen(); return; }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                alert('Este navegador ou celular não permite compartilhar a tela. Tente no computador (Chrome, Edge ou Firefox).');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                screenTrack = stream.getVideoTracks()[0];
                screenTrack.onended = () => stopScreen();
                await replaceSentVideo(screenTrack);
                $('btn-screen').classList.add('active');
            } catch (e) {
                // Usuário cancelou ou o sistema negou
            }
        };

        async function stopScreen() {
            if (!screenTrack) return;
            screenTrack.stop();
            screenTrack = null;
            const cam = localStream && localStream.getVideoTracks()[0];
            if (cam) await replaceSentVideo(cam);
            $('btn-screen').classList.remove('active');
        }

        $('btn-hang').onclick = () => {
            if (screenTrack) screenTrack.stop();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (call) call.close();
            if (dataConn) dataConn.close();
            if (peer) peer.destroy();
            location.reload();
        };

        $('btn-create').onclick = () => enter(true);
        $('btn-join').onclick = () => enter(false);
        $('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
    </script>
</body>

</html>
